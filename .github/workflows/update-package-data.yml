name: Update pub.dev Package Data

on:
  # 매월 1일 자정 (UTC 기준, 한국시간 오전 9시)
  schedule:
    - cron: '0 0 1 * *'

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      skip_collection:
        description: 'Skip data collection (use existing data)'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 최대 2시간

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Restore collection progress (if exists)
        uses: actions/cache@v4
        with:
          path: |
            data/collection-progress.json
            data/all-packages.json
          key: package-data-${{ github.run_id }}
          restore-keys: |
            package-data-

      - name: Collect package data
        if: ${{ github.event.inputs.skip_collection != 'true' }}
        run: |
          echo "Starting package data collection..."
          node scripts/collect-all-packages.js --resume || node scripts/collect-all-packages.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Generate static data files
        run: |
          echo "Generating static data files..."
          node scripts/generate-static-data.js

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 커밋 메시지에 날짜와 패키지 수 포함
          PACKAGE_COUNT=$(cat frontend/public/data/meta.json | grep -o '"totalPackages":[0-9]*' | grep -o '[0-9]*' || echo "N/A")
          DATE=$(date +'%Y-%m-%d')

          git add -A
          git commit -m "chore: update pub.dev package data [$DATE]

          - Total packages: $PACKAGE_COUNT
          - Auto-generated by GitHub Actions

          [skip ci]"

          git push

      - name: Upload artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collection-progress
          path: |
            data/collection-progress.json
            data/all-packages.json
          retention-days: 7

      - name: Summary
        run: |
          echo "## Package Data Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "frontend/public/data/meta.json" ]; then
            TOTAL=$(cat frontend/public/data/meta.json | grep -o '"totalPackages":[0-9]*' | grep -o '[0-9]*' || echo "N/A")
            UPDATED=$(cat frontend/public/data/meta.json | grep -o '"lastUpdated":"[^"]*"' | cut -d'"' -f4 || echo "N/A")
            echo "- **Total Packages:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Last Updated:** $UPDATED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          ls -lh frontend/public/data/*.json 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "No files generated" >> $GITHUB_STEP_SUMMARY
