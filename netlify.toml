[build]
  command = "node scripts/bundle-examples.js && npm install --prefix frontend && npm run build && cp -r data frontend/dist/ && cp -r netlify/functions/data/examples frontend/dist/guides"
  functions = "netlify/functions"
  publish = "frontend/dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@google/generative-ai"]
  included_files = ["netlify/functions/data/**"]

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000

# 정적 데이터 파일 캐싱 (30일)
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
    Content-Type = "application/json; charset=utf-8"

# 정적 자산 캐싱 (1년)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API 리다이렉트
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200